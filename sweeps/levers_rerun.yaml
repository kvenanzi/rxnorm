# Make-up grid for sweeps/levers.yaml: the aux=none cells on splits v3..v6 of
# sweep nypttmi8. Twelve failed on a loader assertion (a few MTHSPL strings
# whose targets span splits; fixed in rxnorm_vandf/data.py) and two v6 cells
# were killed when the agent was stopped. A grid sweep never re-issues a
# failed cell, so they run again here (16 cells; one, v6/seed 42/VANDF, is a
# duplicate of a finished cell) and `13_levers.py summarize` merges the sweeps.
name: levers-rerun
method: grid
metric:
  name: val/acc@1
  goal: maximize
parameters:
  base_model:
    value: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
  negatives:
    value: ingredient
  normalize_strength:
    value: true
  dataset_artifact:
    value: vandf-rxnorm-multi:v0
  dataset_subdir:
    values: [v3, v4, v5, v6]
  train_sources:
    values: ["VANDF", "VANDF,MTHSPL"]
  aux:
    value: none
  aux_weight:
    value: 0.01
  seed:
    values: [42, 1]
  epochs:
    value: 4
  batch_size:
    value: 64
  lr:
    value: 2.0e-5
