# Make-up grid for sweeps/levers.yaml: the two strength-head cells on split v1,
# seed 42, that failed in sweep nypttmi8 (the loss imported a sentence-
# transformers internal that Colab's version lacks; fixed in losses.py). A
# grid sweep never re-issues a failed cell; `13_levers.py summarize` merges.
name: levers-rerun-head
method: grid
metric:
  name: val/acc@1
  goal: maximize
parameters:
  base_model:
    value: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
  negatives:
    value: ingredient
  normalize_strength:
    value: true
  dataset_artifact:
    value: vandf-rxnorm-multi:v0
  dataset_subdir:
    value: v1
  train_sources:
    values: ["VANDF", "VANDF,MTHSPL"]
  aux:
    value: strength
  aux_weight:
    value: 0.01
  seed:
    value: 42
  epochs:
    value: 4
  batch_size:
    value: 64
  lr:
    value: 2.0e-5
