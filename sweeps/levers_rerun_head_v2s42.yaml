# Make-up grid for sweeps/levers.yaml: the strength-head pair on split v2,
# seed 42, lost in sweep nypttmi8 (the VA-only cell hit the sentence-
# transformers import since fixed in losses.py; the SPL cell was killed when
# the agent was stopped). Companion of levers_rerun_head_v1s1.yaml; see there.
name: levers-rerun-head-v2s42
method: grid
metric:
  name: val/acc@1
  goal: maximize
parameters:
  base_model:
    value: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
  negatives:
    value: ingredient
  normalize_strength:
    value: true
  dataset_artifact:
    value: vandf-rxnorm-multi:v0
  dataset_subdir:
    value: v2
  train_sources:
    values: ["VANDF", "VANDF,MTHSPL"]
  aux:
    value: strength
  aux_weight:
    value: 0.01
  seed:
    value: 42
  epochs:
    value: 4
  batch_size:
    value: 64
  lr:
    value: 2.0e-5
